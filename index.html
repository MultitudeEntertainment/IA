<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Assistant IA simple (100% fonctionnel)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      max-width: 1100px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
    }

    header {
      flex-shrink: 0;
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafb;
    }

    .bloc-titre {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .titre {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }

    .soustitre {
      font-size: 12px;
      color: #6b7280;
    }

    .bloc-etat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #4b5563;
    }

    .point-etat {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
    }

    .zone-chat {
      position: relative;
      flex: 1;
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f3f4f6;
    }

    .placeholder {
      margin: auto;
      text-align: center;
      max-width: 420px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    .placeholder strong {
      display: block;
      margin-bottom: 4px;
      color: #111827;
    }

    .ligne-message {
      display: flex;
    }

    .ligne-message.utilisateur {
      justify-content: flex-end;
    }

    .ligne-message.assistant {
      justify-content: flex-start;
    }

    .bloc-bulle {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bulle {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: apparition 0.18s ease-out;
    }

    .ligne-message.utilisateur .bulle {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .ligne-message.assistant .bulle {
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .meta {
      font-size: 11px;
      color: #9ca3af;
    }

    .barre-entree {
      flex-shrink: 0;
      padding: 10px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .conteneur-entree {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .entree {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .entree::placeholder {
      color: #9ca3af;
    }

    .entree:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .astuce {
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }

    .bouton-envoyer {
      width: 46px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .bouton-envoyer:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .bouton-envoyer:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3);
    }

    .bouton-envoyer.desactive {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e5e7eb;
      font-size: 11px;
      color: #4b5563;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #6b7280;
      opacity: 0.3;
      animation: clignote 1.3s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes clignote {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-1px); }
    }

    @media (max-width: 768px) {
      .app {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }
      header {
        padding: 12px 14px;
      }
      .zone-chat {
        padding: 10px 12px;
      }
      .bulle {
        max-width: 90%;
      }
      .barre-entree {
        padding: 8px 10px;
      }
      .entree {
        font-size: 13px;
      }
      .astuce {
        font-size: 10px;
      }
      .bouton-envoyer {
        width: 42px;
        height: 38px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="bloc-titre">
        <div class="titre">Assistant IA simple</div>
        <div class="soustitre">Réponses en français (sans Internet)</div>
      </div>
      <div class="bloc-etat">
        <div class="point-etat"></div>
        <div style="font-size:11px;color:#4b5563;">Actif</div>
      </div>
    </header>

    <main class="zone-chat" id="zone-chat">
      <div class="placeholder" id="placeholder">
        <strong>Bienvenue.</strong>
        Cet assistant fonctionne à 100% sans connexion extérieure.<br />
        Il connaît la date, l’heure et répond simplement à tes questions fréquentes en français.
      </div>
    </main>

    <footer class="barre-entree">
      <div class="conteneur-entree">
        <textarea
          id="entree"
          class="entree"
          placeholder="Écris ici… (Entrée pour envoyer, Shift+Entrée pour un retour à la ligne)"
        ></textarea>
        <div class="astuce">Entrée pour envoyer · Shift+Entrée pour retour à la ligne</div>
      </div>
      <button id="bouton-envoyer" class="bouton-envoyer desactive" disabled>➤</button>
    </footer>
  </div>

  <script>
    const zoneChat = document.getElementById("zone-chat");
    const placeholder = document.getElementById("placeholder");
    const entree = document.getElementById("entree");
    const boutonEnvoyer = document.getElementById("bouton-envoyer");

    let enCoursEnvoi = false;
    let blocTyping = null;

    function retirerPlaceholder() {
      if (placeholder && placeholder.parentNode) {
        placeholder.remove();
      }
    }

    function ajouterMessage(role, texte) {
      retirerPlaceholder();

      const ligne = document.createElement("div");
      ligne.className = "ligne-message " + role;

      const bloc = document.createElement("div");
      bloc.className = "bloc-bulle";

      const bulle = document.createElement("div");
      bulle.className = "bulle";
      bulle.textContent = texte;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "utilisateur" ? "Vous" : "Assistant";

      bloc.appendChild(bulle);
      bloc.appendChild(meta);
      ligne.appendChild(bloc);
      zoneChat.appendChild(ligne);

      zoneChat.scrollTop = zoneChat.scrollHeight;
    }

    function afficherTyping() {
      if (blocTyping) return;

      blocTyping = document.createElement("div");
      blocTyping.className = "ligne-message assistant";

      const bloc = document.createElement("div");
      bloc.className = "bloc-bulle";

      const bulle = document.createElement("div");
      bulle.className = "typing";
      bulle.innerHTML = `
        <span>Réflexion...</span>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;

      bloc.appendChild(bulle);
      blocTyping.appendChild(bloc);
      zoneChat.appendChild(blocTyping);
      zoneChat.scrollTop = zoneChat.scrollHeight;
    }

    function cacherTyping() {
      if (blocTyping && blocTyping.parentNode) {
        blocTyping.remove();
      }
      blocTyping = null;
    }

    function infosTemps() {
      const now = new Date();
      const jours = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
      const mois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      return {
        jourSemaine: jours[now.getDay()],
        jour: now.getDate(),
        moisNom: mois[now.getMonth()],
        annee: now.getFullYear(),
        heure: String(now.getHours()).padStart(2,"0"),
        minute: String(now.getMinutes()).padStart(2,"0")
      };
    }

    function reponseLocale(message) {
      const brut = message || "";
      const t = brut.toLowerCase().trim();

      if (!t) {
        return "Je n’ai pas reçu de question. Écris-moi quelques mots.";
      }

      // Salutations
      if (t.match(/\b(bonjour|salut|coucou|bonsoir|yo|wesh)\b/)) {
        return "Bonjour ! Que veux-tu savoir ?";
      }

      // Comment ça va
      if (t.includes("ça va") || t.includes("ca va")) {
        return "Je vais bien, merci. Et toi, comment tu vas ?";
      }

      const { jourSemaine, jour, moisNom, annee, heure, minute } = infosTemps();

      // Date complète
      if (
        t.includes("quel jour sommes") ||
        t.includes("quel jour sommes-nous") ||
        t.includes("quel jour est-il") ||
        t.includes("on est quel jour") ||
        t.includes("c'est quel jour") ||
        t.includes("c est quel jour") ||
        t.includes("quel jour on est") ||
        t.includes("nous sommes quel jour")
      ) {
        return "Nous sommes " + jourSemaine + " " + jour + " " + moisNom + " " + annee + ".";
      }

      // Jour de la semaine
      if (t.includes("quel jour de la semaine") || t.includes("jour de la semaine")) {
        return "Aujourd’hui, nous sommes " + jourSemaine + ".";
      }

      // Mois
      if (
        t.includes("quel mois") ||
        t.includes("on est quel mois") ||
        t.includes("c'est quel mois") ||
        t.includes("c est quel mois") ||
        t.includes("nous sommes quel mois")
      ) {
        return "Nous sommes en " + moisNom + " " + annee + ".";
      }

      // Année
      if (
        t.includes("quelle année") ||
        t.includes("quelle annee") ||
        t.includes("on est en quelle année") ||
        t.includes("on est en quelle annee") ||
        t.includes("en quelle année sommes-nous") ||
        t.includes("en quelle annee sommes nous") ||
        t.includes("nous sommes en quelle année")
      ) {
        return "Nous sommes en " + annee + ".";
      }

      // Heure
      if (
        (t.includes("heure") && !t.includes("heureux")) ||
        t.includes("il est quelle heure") ||
        t.includes("donne l'heure") ||
        t.includes("donne l heure")
      ) {
        return "Il est " + heure + "h" + minute + " d’après l’horloge de ton appareil.";
      }

      // Questions type "c'est quoi", "qui est"
      if (
        t.startsWith("c'est quoi") || t.startsWith("c est quoi") ||
        t.startsWith("qu'est-ce que") || t.startsWith("qu est ce que") ||
        t.startsWith("qui est") || t.startsWith("qui était") || t.startsWith("qui etait")
      ) {
        return "Je suis un assistant simple sans connexion Internet. Je ne peux pas tout connaître, mais tu peux préciser ce que tu veux comprendre, et je peux t’aider à reformuler ou te donner une explication générale.";
      }

      // Aide
      if (t.includes("aide") || t.includes("peux-tu m'aider") || t.includes("peux tu m aider")) {
        return "Je peux te donner la date, l’heure, réagir à des questions simples et t’aider à reformuler des phrases ou des idées en français.";
      }

      // Reformulation
      if (t.startsWith("reformule ") || t.startsWith("reformule:") || t.startsWith("reformule :")) {
        const texteAReformuler = brut.replace(/reformule\s*:?\s*/i, "");
        if (!texteAReformuler.trim()) {
          return "Colle la phrase à reformuler après \"reformule\" et je te proposerai une version plus claire.";
        }
        return "Voici une reformulation possible :\n\n" + texteAReformuler.trim();
      }

      // Fallback générique
      return "Je suis un assistant simple sans accès à toute la connaissance du monde. Je peux t’aider pour la date, l’heure, des petites explications ou des reformulations en français, mais je ne peux pas répondre à toutes les questions de culture générale.";
    }

    async function envoyerMessage() {
      if (enCoursEnvoi) return;

      const texte = entree.value.trim();
      if (!texte) return;

      ajouterMessage("utilisateur", texte);
      entree.value = "";
      entree.style.height = "auto";

      enCoursEnvoi = true;
      boutonEnvoyer.disabled = true;
      boutonEnvoyer.classList.add("desactive");

      afficherTyping();

      setTimeout(() => {
        const reponse = reponseLocale(texte);
        cacherTyping();
        ajouterMessage("assistant", reponse);
        enCoursEnvoi = false;

        const vide = entree.value.trim().length === 0;
        boutonEnvoyer.disabled = vide;
        boutonEnvoyer.classList.toggle("desactive", vide);
      }, 300);
    }

    boutonEnvoyer.addEventListener("click", envoyerMessage);

    entree.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        envoyerMessage();
      }
    });

    entree.addEventListener("input", () => {
      entree.style.height = "auto";
      entree.style.height = Math.min(entree.scrollHeight, 140) + "px";
      const vide = entree.value.trim().length === 0;
      if (!enCoursEnvoi) {
        boutonEnvoyer.disabled = vide;
        boutonEnvoyer.classList.toggle("desactive", vide);
      }
    });

    boutonEnvoyer.disabled = true;
    boutonEnvoyer.classList.add("desactive");
  </script>
</body>
</html>
