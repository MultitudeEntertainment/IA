<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Assistant IA (simple, stable)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      max-width: 1100px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
    }

    header {
      flex-shrink: 0;
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafb;
    }

    .bloc-titre {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .titre {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }

    .soustitre {
      font-size: 12px;
      color: #6b7280;
    }

    .bloc-etat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #4b5563;
    }

    .point-etat {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
    }

    .zone-chat {
      position: relative;
      flex: 1;
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f3f4f6;
    }

    .placeholder {
      margin: auto;
      text-align: center;
      max-width: 420px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    .placeholder strong {
      display: block;
      margin-bottom: 4px;
      color: #111827;
    }

    .ligne-message {
      display: flex;
    }

    .ligne-message.utilisateur {
      justify-content: flex-end;
    }

    .ligne-message.assistant {
      justify-content: flex-start;
    }

    .bloc-bulle {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bulle {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: apparition 0.18s ease-out;
    }

    .ligne-message.utilisateur .bulle {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .ligne-message.assistant .bulle {
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .meta {
      font-size: 11px;
      color: #9ca3af;
    }

    .barre-entree {
      flex-shrink: 0;
      padding: 10px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .conteneur-entree {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .entree {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .entree::placeholder {
      color: #9ca3af;
    }

    .entree:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .astuce {
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }

    .bouton-envoyer {
      width: 46px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .bouton-envoyer:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .bouton-envoyer:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3);
    }

    .bouton-envoyer.desactive {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .app {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }
      header {
        padding: 12px 14px;
      }
      .zone-chat {
        padding: 10px 12px;
      }
      .bulle {
        max-width: 90%;
      }
      .barre-entree {
        padding: 8px 10px;
      }
      .entree {
        font-size: 13px;
      }
      .astuce {
        font-size: 10px;
      }
      .bouton-envoyer {
        width: 42px;
        height: 38px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="bloc-titre">
        <div class="titre">Assistant IA</div>
        <div class="soustitre">Conversation en français (mode simple)</div>
      </div>
      <div class="bloc-etat">
        <div class="point-etat"></div>
        <div>Actif</div>
      </div>
    </header>

    <main class="zone-chat" id="zone-chat">
      <div class="placeholder" id="placeholder">
        <strong>Bienvenue.</strong>
        Écris un message en bas pour commencer.<br />
        L’assistant répondra en français de manière simple et cohérente.
      </div>
    </main>

    <footer class="barre-entree">
      <div class="conteneur-entree">
        <textarea
          id="entree"
          class="entree"
          placeholder="Écris ici… (Entrée pour envoyer, Shift+Entrée pour un retour à la ligne)"
        ></textarea>
        <div class="astuce">Entrée pour envoyer · Shift+Entrée pour retour à la ligne</div>
      </div>
      <button id="bouton-envoyer" class="bouton-envoyer desactive" disabled>➤</button>
    </footer>
  </div>

  <script>
    const zoneChat = document.getElementById("zone-chat");
    const placeholder = document.getElementById("placeholder");
    const entree = document.getElementById("entree");
    const boutonEnvoyer = document.getElementById("bouton-envoyer");

    let enCoursEnvoi = false;

    function retirerPlaceholder() {
      if (placeholder && placeholder.parentNode) {
        placeholder.remove();
      }
    }

    function ajouterMessage(role, texte) {
      retirerPlaceholder();

      const ligne = document.createElement("div");
      ligne.className = "ligne-message " + role;

      const bloc = document.createElement("div");
      bloc.className = "bloc-bulle";

      const bulle = document.createElement("div");
      bulle.className = "bulle";
      bulle.textContent = texte;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "utilisateur" ? "Vous" : "Assistant";

      bloc.appendChild(bulle);
      bloc.appendChild(meta);
      ligne.appendChild(bloc);
      zoneChat.appendChild(ligne);

      zoneChat.scrollTop = zoneChat.scrollHeight;
    }

    // "IA" simple basée sur des règles en français
    function genererReponseSimple(message) {
      const texte = message.toLowerCase().trim();

      if (!texte) {
        return "Je n’ai rien reçu, tu peux réessayer en écrivant quelques mots ?";
      }

      // Salutations
      if (texte.match(/\b(bonjour|salut|coucou|bonsoir)\b/)) {
        return "Bonjour ! Comment puis-je t’aider ?";
      }

      // Demande d'aide
      if (texte.includes("aide") || texte.includes("aider") || texte.includes("peux-tu")) {
        return "Je peux t’aider à reformuler un texte, expliquer une idée simplement, ou te donner des pistes sur un sujet. Dis-moi ce dont tu as besoin.";
      }

      // Reformulation
      if (texte.includes("reformule") || texte.includes("reformuler")) {
        return "Colle-moi la phrase ou le texte à reformuler, et je te proposerai une version plus claire en français.";
      }

      // Explication
      if (texte.includes("explique") || texte.includes("expliquer")) {
        return "Dis-moi ce que tu veux que j’explique, et je te donnerai une explication simple, étape par étape.";
      }

      // Texte créatif
      if (texte.includes("histoire") || texte.includes("raconte") || texte.includes("texte créatif")) {
        return "Je peux t’inventer un petit texte créatif en français. Par exemple :\n\n« Un matin, tout semblait normal. Pourtant, un simple message allait changer la journée : quelqu’un avait enfin créé une IA qui répondait calmement, sans phrases bizarres. »";
      }

      // Travail / école
      if (texte.includes("devoir") || texte.includes("exercice") || texte.includes("école") || texte.includes("cours")) {
        return "Je peux t’aider à mieux comprendre ton cours, à résumer une notion, ou à t’expliquer un exercice (sans tout faire à ta place). Dis-moi le sujet.";
      }

      // Par défaut
      return "D’accord, je vois. Tu peux me préciser ce que tu attends de moi : une explication, une reformulation, une idée, ou un petit texte ? Je reste en français et j’essaie de rester simple.";
    }

    async function envoyerMessage() {
      if (enCoursEnvoi) return;

      const texte = entree.value.trim();
      if (!texte) return;

      ajouterMessage("utilisateur", texte);
      entree.value = "";
      entree.style.height = "auto";

      enCoursEnvoi = true;
      boutonEnvoyer.disabled = true;
      boutonEnvoyer.classList.add("desactive");

      // Simulation d’un léger temps de réflexion
      setTimeout(() => {
        const reponse = genererReponseSimple(texte);
        ajouterMessage("assistant", reponse);
        enCoursEnvoi = false;
        boutonEnvoyer.disabled = false;
        boutonEnvoyer.classList.remove("desactive");
      }, 300);
    }

    boutonEnvoyer.addEventListener("click", () => {
      envoyerMessage();
    });

    entree.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        envoyerMessage();
      }
    });

    entree.addEventListener("input", () => {
      entree.style.height = "auto";
      entree.style.height = Math.min(entree.scrollHeight, 140) + "px";
      const vide = entree.value.trim().length === 0;
      boutonEnvoyer.disabled = vide || enCoursEnvoi;
      boutonEnvoyer.classList.toggle("desactive", vide || enCoursEnvoi);
    });

    // Au démarrage : bouton actif si focus + texte
    entree.addEventListener("focus", () => {
      const vide = entree.value.trim().length === 0;
      boutonEnvoyer.disabled = vide || enCoursEnvoi;
      boutonEnvoyer.classList.toggle("desactive", vide || enCoursEnvoi);
    });
  </script>
</body>
</html>
