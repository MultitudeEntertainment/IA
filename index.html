<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Assistant IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* =========================================================
       RESET ET BASE
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    /* =========================================================
       APPLICATION PLEIN ÉCRAN
       ========================================================= */
    .app {
      width: 100%;
      height: 100vh;
      max-width: 1100px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
    }

    /* =========================================================
       EN-TÊTE
       ========================================================= */
    header {
      flex-shrink: 0;
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafb;
    }

    .bloc-titre {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .titre {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }

    .soustitre {
      font-size: 12px;
      color: #6b7280;
    }

    .bloc-etat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #4b5563;
    }

    .point-etat {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
    }

    /* =========================================================
       ZONE DE CHAT
       ========================================================= */
    .zone-chat {
      position: relative;
      flex: 1;
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f3f4f6;
    }

    .placeholder {
      margin: auto;
      text-align: center;
      max-width: 420px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    .placeholder strong {
      display: block;
      margin-bottom: 4px;
      color: #111827;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */
    .ligne-message {
      display: flex;
    }

    .ligne-message.utilisateur {
      justify-content: flex-end;
    }

    .ligne-message.assistant {
      justify-content: flex-start;
    }

    .bloc-bulle {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bulle {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: apparition 0.18s ease-out;
    }

    .ligne-message.utilisateur .bulle {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .ligne-message.assistant .bulle {
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .meta {
      font-size: 11px;
      color: #9ca3af;
    }

    /* =========================================================
       INDICATEUR DE SAISIE
       ========================================================= */
    .ligne-saisie {
      display: flex;
      justify-content: flex-start;
    }

    .bulle-saisie {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .point-saisie {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #6b7280;
      opacity: 0.3;
      animation: clignote 1.3s infinite ease-in-out;
    }

    .point-saisie:nth-child(2) {
      animation-delay: 0.2s;
    }

    .point-saisie:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* =========================================================
       BARRE D'ENTRÉE
       ========================================================= */
    .barre-entree {
      flex-shrink: 0;
      padding: 10px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .conteneur-entree {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .entree {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .entree::placeholder {
      color: #9ca3af;
    }

    .entree:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .astuce {
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }

    .bouton-envoyer {
      width: 46px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .bouton-envoyer:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .bouton-envoyer:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3);
    }

    .bouton-envoyer.desactive {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    /* =========================================================
       BANNIÈRE DU MODÈLE
       ========================================================= */
    .banniere-modele {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #e5e7eb;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      border: 1px solid #4b5563;
      z-index: 10;
    }

    .banniere-spinner {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(156,163,175,0.4);
      border-top-color: #e5e7eb;
      animation: tourne 0.8s linear infinite;
    }

    /* =========================================================
       ANIMATIONS
       ========================================================= */
    @keyframes apparition {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes clignote {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-1px); }
    }

    @keyframes tourne {
      to { transform: rotate(360deg); }
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (max-width: 768px) {
      .app {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }

      header {
        padding: 12px 14px;
      }

      .zone-chat {
        padding: 10px 12px;
      }

      .bulle {
        max-width: 90%;
      }

      .barre-entree {
        padding: 8px 10px;
      }

      .entree {
        font-size: 13px;
      }

      .astuce {
        font-size: 10px;
      }

      .bouton-envoyer {
        width: 42px;
        height: 38px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="bloc-titre">
        <div class="titre">Assistant IA</div>
        <div class="soustitre">Conversation en français</div>
      </div>
      <div class="bloc-etat">
        <div class="point-etat"></div>
        <div>Actif</div>
      </div>
    </header>

    <main class="zone-chat" id="zone-chat">
      <div class="placeholder" id="placeholder">
        <strong>Bienvenue.</strong>
        Écris un message en bas pour commencer la conversation.<br />
        L’assistant répondra de manière simple et naturelle.
      </div>
    </main>

    <footer class="barre-entree">
      <div class="conteneur-entree">
        <textarea
          id="entree"
          class="entree"
          placeholder="Écris ici… (Entrée pour envoyer, Shift+Entrée pour un retour à la ligne)"
        ></textarea>
        <div class="astuce">Entrée pour envoyer · Shift+Entrée pour retour à la ligne</div>
      </div>
      <button id="bouton-envoyer" class="bouton-envoyer desactive" disabled>➤</button>
    </footer>
  </div>

  <script type="module">
    // =========================================================
    // IMPORT DE LA LIBRAIRIE IA (modèle caché, pas affiché)
    // =========================================================
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.1";

    // =========================================================
    // RÉFÉRENCES DOM
    // =========================================================
    const zoneChat = document.getElementById("zone-chat");
    const placeholder = document.getElementById("placeholder");
    const entree = document.getElementById("entree");
    const boutonEnvoyer = document.getElementById("bouton-envoyer");

    // =========================================================
    // ÉTAT GLOBAL
    // =========================================================
    let generateur = null;
    let modelePret = false;
    let enCoursEnvoi = false;
    let blocSaisie = null;

    // =========================================================
    // BANNIÈRE DE CHARGEMENT
    // =========================================================
    const banniere = document.createElement("div");
    banniere.className = "banniere-modele";
    banniere.innerHTML = `
      <div class="banniere-spinner"></div>
      <div>Préparation de l’assistant…</div>
    `;
    zoneChat.appendChild(banniere);

    // =========================================================
    // CHARGEMENT DU MODÈLE
    // =========================================================
    async function chargerModele() {
      try {
        // Modèle interne, utilisable dans le navigateur, nom jamais affiché.
        generateur = await pipeline(
          "text-generation",
          "Xenova/gpt2"
        );

        modelePret = true;
        banniere.innerHTML = `
          <div class="banniere-spinner" style="border-top-color:#22c55e;"></div>
          <div>Assistant prêt.</div>
        `;
        setTimeout(() => {
          if (banniere && banniere.parentNode) {
            banniere.remove();
          }
        }, 1500);

        boutonEnvoyer.disabled = false;
        boutonEnvoyer.classList.remove("desactive");
      } catch (e) {
        console.error("Erreur lors du chargement du modèle :", e);
        banniere.innerHTML = `
          <div style="width:12px;height:12px;border-radius:999px;background:#ef4444;"></div>
          <div>Erreur lors de la préparation de l’assistant.</div>
        `;
      }
    }

    chargerModele();

    // =========================================================
    // FONCTIONS D'AFFICHAGE
    // =========================================================
    function retirerPlaceholder() {
      if (placeholder && placeholder.parentNode) {
        placeholder.remove();
      }
    }

    function ajouterMessage(role, texte) {
      retirerPlaceholder();

      const ligne = document.createElement("div");
      ligne.className = "ligne-message " + role;

      const bloc = document.createElement("div");
      bloc.className = "bloc-bulle";

      const bulle = document.createElement("div");
      bulle.className = "bulle";
      bulle.textContent = texte;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "utilisateur" ? "Vous" : "Assistant";

      bloc.appendChild(bulle);
      bloc.appendChild(meta);
      ligne.appendChild(bloc);
      zoneChat.appendChild(ligne);

      zoneChat.scrollTop = zoneChat.scrollHeight;
    }

    function afficherSaisie() {
      if (blocSaisie) return;
      blocSaisie = document.createElement("div");
      blocSaisie.className = "ligne-saisie";
      blocSaisie.innerHTML = `
        <div class="bulle-saisie">
          <div class="point-saisie"></div>
          <div class="point-saisie"></div>
          <div class="point-saisie"></div>
        </div>
      `;
      zoneChat.appendChild(blocSaisie);
      zoneChat.scrollTop = zoneChat.scrollHeight;
    }

    function cacherSaisie() {
      if (blocSaisie && blocSaisie.parentNode) {
        blocSaisie.remove();
      }
      blocSaisie = null;
    }

    // =========================================================
    // NETTOYAGE DU TEXTE GÉNÉRÉ
    // (éviter les phrases trop bizarres / couper proprement)
    // =========================================================
    function nettoyerReponse(texteBrut) {
      if (!texteBrut) return "Je n’ai pas pu générer de réponse.";

      // On enlève les guillemets parasites en début/fin
      let t = texteBrut.trim();
      t = t.replace(/^["']+/, "").replace(/["']+$/, "").trim();

      // On essaie de garder une ou deux phrases maximum
      // en cherchant les points/points d’interrogation/exclamation.
      const fins = [".", "?", "!"];
      let indexFin = -1;
      for (let i = 0; i < t.length; i++) {
        if (fins.includes(t[i])) {
          indexFin = i;
          // on s’arrête à la première phrase complète raisonnable
          if (i > 20) break;
        }
      }

      if (indexFin !== -1) {
        t = t.slice(0, indexFin + 1);
      }

      // On enlève les morceaux trop courts ou incomplets
      if (t.length < 5) {
        return "Je n’ai pas de réponse utile à donner pour l’instant.";
      }

      return t;
    }

    // =========================================================
    // GÉNÉRATION DE LA RÉPONSE
    // =========================================================
    async function genererReponse(texteUtilisateur) {
      if (!generateur) {
        return "L’assistant n’est pas encore prêt. Attends quelques instants puis réessaie.";
      }

      // On force le contexte en français pour limiter l’anglais
      const prompt =
        "Tu es un assistant qui répond en français simple et clair. " +
        "Réponds en quelques phrases maximum, sans écrire d’histoires étranges.\n\n" +
        "Utilisateur : " + texteUtilisateur + "\n" +
        "Assistant :";

      const resultats = await generateur(prompt, {
        max_new_tokens: 80,
        temperature: 0.7,
        top_p: 0.9,
        repetition_penalty: 1.1
      });

      const texteComplet = resultats[0]?.generated_text || "";
      let reponseBrute;

      if (texteComplet.startsWith(prompt)) {
        reponseBrute = texteComplet.slice(prompt.length).trim();
      } else {
        reponseBrute = texteComplet.trim();
      }

      return nettoyerReponse(reponseBrute);
    }

    // =========================================================
    // ENVOI DU MESSAGE
    // =========================================================
    async function envoyerMessage() {
      if (!modelePret || enCoursEnvoi) return;

      const texte = entree.value.trim();
      if (!texte) return;

      ajouterMessage("utilisateur", texte);
      entree.value = "";
      entree.style.height = "auto";

      enCoursEnvoi = true;
      boutonEnvoyer.disabled = true;
      boutonEnvoyer.classList.add("desactive");

      afficherSaisie();

      try {
        const reponse = await genererReponse(texte);
        cacherSaisie();
        ajouterMessage("assistant", reponse);
      } catch (e) {
        console.error("Erreur génération :", e);
        cacherSaisie();
        ajouterMessage("assistant", "Une erreur est survenue lors de la génération de la réponse.");
      } finally {
        enCoursEnvoi = false;
        if (modelePret) {
          boutonEnvoyer.disabled = false;
          boutonEnvoyer.classList.remove("desactive");
        }
      }
    }

    // =========================================================
    // GESTION DES ÉVÉNEMENTS
    // =========================================================
    boutonEnvoyer.addEventListener("click", () => {
      envoyerMessage();
    });

    entree.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        envoyerMessage();
      }
    });

    entree.addEventListener("input", () => {
      entree.style.height = "auto";
      entree.style.height = Math.min(entree.scrollHeight, 140) + "px";
    });
  </script>
</body>
</html>
